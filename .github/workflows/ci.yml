name: ci

# Compile + test on every push and pull request.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build + test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Smoke-test the launcher
        run: |
          set -euo pipefail
          ./gradlew :kermes-app:installDist --no-daemon
          launcher="$(find kermes-app/build/install -type f -path '*/bin/kermes' | head -n1)"
          test -n "$launcher"
          "$launcher" version
          "$launcher" help >/dev/null
