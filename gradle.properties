org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Where Gradle's toolchain auto-detection should look. Homebrew installs
# openjdk@21 as keg-only at /opt/homebrew/opt/openjdk@21, which is not in
# Gradle's default search paths.
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home

# Kotlin compiler in-process JVM
kotlin.daemon.jvm.options=-Xmx1500m
